<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>“海洋科学”课程笔记</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="本科课程学习笔记库">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">加载中，请稍候...</div>

  <script>
    window.$docsify = {
      // 1. 基本信息配置
      name: '“海洋科学”课程笔记',
      repo: 'https://github.com/MUXIEREPU/Notes',
      
      // 2. 侧边栏与目录配置
      loadSidebar: true, // 开启侧边栏（需根目录有 _sidebar.md）
      subMaxLevel: 3,    // 侧边栏显示的标题深度
      auto2top: true,    // 切换页面后自动回到顶部
      
      // 3. 路由与路径修正（解决 404/首页加载的关键）
      homepage: 'README.md', // 明确首页文件
      basePath: '/',         // 强制从根目录解析路径
      notFoundPage: true,    // 开启 404 页面支持

      // 4. 插件配置：搜索功能
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索笔记...',
        noData: '未找到相关结果',
        depth: 6
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
